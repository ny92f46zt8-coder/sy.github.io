<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;background:#000}
.box{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90%;
}
img{
  max-width:400px;
  width:100%;
  margin-bottom:30px;
}
h1{
  font-size:clamp(60px,12vw,180px);
  background:linear-gradient(90deg,#ff69b4,#ff1493,#ff4500);
  -webkit-background-clip:text;
  color:transparent;
  animation:glow 2s infinite alternate;
  margin:0;
}
@keyframes glow{
  0%{filter:drop-shadow(0 0 5px pink)}
  100%{filter:drop-shadow(0 0 20px red)}
}
</style>
</head>
<body>
<div class="box">
  <img src="https://img2.baidu.com/it/u=1245709357,4267765407&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=773" alt="孙怡">
  <h1>孙怡微博</h1>
</div>

<!-- 背景音乐，隐藏控件，循环播放 -->
<audio id="bgMusic" loop>
  <source src="./yihan.mp3" type="audio/mpeg">

<script>
const bgMusic = document.getElementById('bgMusic');
// 点击页面任意位置触发播放
document.body.addEventListener('click', ()=>{
  bgMusic.play();
})
</script>

</body>
</html>
