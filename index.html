<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;background:#000}
.box{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90%;
}
img{
  max-width:400px;
  width:100%;
  margin-bottom:30px;
}
h1{
  font-size:clamp(60px,12vw,180px);
  background:linear-gradient(90deg,#ff69b4,#ff1493,#ff4500);
  -webkit-background-clip:text;
  color:transparent;
  animation:glow 2s infinite alternate;
  margin:0;
}
@keyframes glow{
  0%{filter:drop-shadow(0 0 5px pink)}
  100%{filter:drop-shadow(0 0 20px red)}
}
/* 播放按钮样式 */
#playBtn{
  margin-top:20px;
  padding:12px 30px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:#ff69b4;
  color:#fff;
  cursor:pointer;
}
#playBtn:hover{
  background:#ff3b80;
}
</style>
</head>
<body>
<div class="box">
  <img src="替换无防盗链图片直链" alt="孙怡">
  <h1>孙怡微博</h1>
  <button id="playBtn">🎵 点击播放音乐</button>
</div>

<audio id="bgMusic" loop>
  <source src="./yihan.mp3" type="audio/mpeg">
  浏览器不支持音频

<script>
const bgMusic = document.getElementById('bgMusic');
const playBtn = document.getElementById('playBtn');
let isPlaying = false;

playBtn.onclick = function(){
  if(!isPlaying){
    bgMusic.play();
    playBtn.innerText = "⏸ 暂停音乐";
    isPlaying = true;
  }else{
    bgMusic.pause();
    playBtn.innerText = "🎵 点击播放音乐";
    isPlaying = false;
  }
}
</script>

</body>
</html>
